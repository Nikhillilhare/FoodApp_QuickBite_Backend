spring.application.name=foodapp

# ---------------------------------------------------------------------
# Database (MySQL)
# ---------------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/newfooddb
spring.datasource.username=${DB_USERNAME:W1_92793_Nikhil}
spring.datasource.password=${DB_PASSWORD:manager}

# ---------------------------------------------------------------------
# JPA / Hibernate
# validate = Hibernate must NOT auto-modify the schema; Flyway owns schema changes
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Flyway (runs V1__food_schema.sql automatically on startup)
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------
# Mail
# ---------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=nikhillilhare17@gmail.com
spring.mail.password=ljwqhizrsovjwzjy

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
# Custom application properties (read via @Value in Java code)
# ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying}
app.jwt.access-token-expiry-ms=86400000
app.jwt.refresh-token-expiry-ms=604800000

app.otp.expiry-minutes=10
app.otp.max-request-per-minute=1

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000,http://localhost:3001}

# ---------------------------------------------------------------------
# Swagger UI
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
